name: Build DMG & APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（X.Y.Z 或 X.Y.Z-rc.N，例如 0.4.1-rc.4）"
        required: false
        default: "0.4.1-rc.4"
        type: string
      macos_arch:
        description: "macOS 架构"
        required: false
        default: "arm64"
        type: choice
        options:
          - arm64
          - both

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  XCODE_VERSION: "27.2"

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.macos_arch == 'both' && '[{"arch":"arm64","target":"aarch64-apple-darwin"},{"arch":"x64","target":"x86_64-apple-darwin"}]' || '[{"arch":"arm64","target":"aarch64-apple-darwin"}]') }}
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version || '0.4.1-rc.4' }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set version
        run: node .github/scripts/set-version.mjs "$VERSION"

      - name: Configure optional relay variables
        env:
          VAR_SERVER: ${{ vars.AIRHAND_SERVER }}
          VAR_SERVER_FP: ${{ vars.AIRHAND_SERVER_FP }}
        run: |
          if [ -n "$VAR_SERVER" ]; then
            echo "AIRHAND_SERVER=$VAR_SERVER" >> "$GITHUB_ENV"
          fi
          if [ -n "$VAR_SERVER_FP" ]; then
            echo "AIRHAND_SERVER_FP=$VAR_SERVER_FP" >> "$GITHUB_ENV"
          fi

      - name: Build DMG
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npx tauri build --target ${{ matrix.target }}

      - name: Collect
        run: |
          mkdir -p dist
          cp client/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "dist/Airhand_${VERSION}_macos-${{ matrix.arch }}.dmg"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: dist/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version || '0.4.1-rc.4' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Set version
        run: node .github/scripts/set-version.mjs "$VERSION"

      - name: Configure optional relay variables
        env:
          VAR_SERVER: ${{ vars.AIRHAND_SERVER }}
          VAR_SERVER_FP: ${{ vars.AIRHAND_SERVER_FP }}
        run: |
          if [ -n "$VAR_SERVER" ]; then
            echo "AIRHAND_SERVER=$VAR_SERVER" >> "$GITHUB_ENV"
          fi
          if [ -n "$VAR_SERVER_FP" ]; then
            echo "AIRHAND_SERVER_FP=$VAR_SERVER_FP" >> "$GITHUB_ENV"
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AIRHAND_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a throwaway debug key and can't be installed over earlier releases"
          fi

      - name: Test & Build APK
        working-directory: android
        env:
          AIRHAND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AIRHAND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AIRHAND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -Pkotlin.compiler.execution.strategy=in-process

      - name: Collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/Airhand_${VERSION}_android.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error
